name: Test Java Starter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test
        run: gradle --no-daemon clean test
      - name: Test JitPack mirror configuration
        env:
          JITPACK: "true"
          GROUP: "com.github.BangShou1st"
          ARTIFACT: "kilo-gateway"
          VERSION: "v0.2.1"
        run: gradle --no-daemon clean test
